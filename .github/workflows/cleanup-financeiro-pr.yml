name: Cleanup financeiro PR artifacts

on:
  push:
    branches:
      - fix/financeiro-relatorios-actions

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore generated files to main state
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- src/routeTree.gen.ts
          rm -f package-lock.json
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/cleanup-financeiro-pr.yml .github/workflows/commit-financeiro-final.yml .github/workflows/minimal-financeiro-actions.yml .github/workflows/verify-financeiro-patch.yml .github/workflows/run-financeiro-patch.yml .github/workflows/one-shot-financeiro-actions.yml scripts/restore_and_patch_financeiro.py scripts/patch_financeiro_relatorios.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove artefatos temporários do patch financeiro"
          git push origin HEAD:fix/financeiro-relatorios-actions
