name: Apply Phase 4 Client Finance
on:
  push:
    branches: [feat/fase-4-financeiro-cliente]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch client profile finance
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/clientes.tsx')
          s = p.read_text()
          old = '''        const { data, error } = await supabase
          .from("payments")
          .select("id, valor, data_pagamento, responsavel_recebimento, metodo_pagamento, descricao, document_id, documents!inner(cliente_id, numero_processo, cliente)")
          .eq("documents.cliente_id", client!.id)
          .order("data_pagamento", { ascending: false });'''
          new = '''        const { data, error } = await supabase
          .from("payments")
          .select("id, valor, data_pagamento, responsavel_recebimento, metodo_pagamento, descricao, document_id, documents(numero_processo)")
          .eq("client_id", client!.id)
          .order("data_pagamento", { ascending: false });'''
          if old not in s: raise SystemExit('payments query target not found')
          s = s.replace(old, new, 1)
          old_type = '''        id: string; valor: number; data_pagamento: string; responsavel_recebimento: string;
        metodo_pagamento: string; descricao: string | null;
        documents: { numero_processo: string; cliente: string } | null;'''
          new_type = '''        id: string; valor: number; data_pagamento: string; responsavel_recebimento: string;
        metodo_pagamento: string; descricao: string | null; document_id: string | null;
        documents: { numero_processo: string } | null;'''
          if old_type not in s: raise SystemExit('payments type target not found')
          s = s.replace(old_type, new_type, 1)
          marker = '''        {client && (
          <div className="space-y-6">
            <div className="grid grid-cols-1 gap-3 text-sm sm:grid-cols-2">'''
          replacement = '''        {client && (
          <div className="space-y-6">
            <div className="grid grid-cols-1 gap-3 text-sm sm:grid-cols-2">'''
          if marker not in s: raise SystemExit('profile marker not found')
          s = s.replace(marker, replacement, 1)
          pays_marker = '''  return (
    <Dialog open={enabled} onOpenChange={(o) => !o && onClose()}>
      <DialogContent className="w-[calc(100vw-2rem)] max-w-3xl max-h-[85vh] overflow-y-auto">
        <DialogHeader>
          <DialogTitle>{client?.nome}</DialogTitle>
        </DialogHeader>
        {client && (
          <div className="space-y-6">
            <div className="grid grid-cols-1 gap-3 text-sm sm:grid-cols-2">
              <Info label="CPF/CNPJ" value={client.cpf_cnpj ?? "—"} />
              <Info label="Telefone" value={client.telefone} />
              <Info label="E-mail" value={client.email ?? "—"} />
              <Info label="Endereço" value={client.endereco ?? "—"} />
            </div>'''
          summary = '''  return (
    <Dialog open={enabled} onOpenChange={(o) => !o && onClose()}>
      <DialogContent className="w-[calc(100vw-2rem)] max-w-4xl max-h-[85vh] overflow-y-auto">
        <DialogHeader>
          <DialogTitle>{client?.nome}</DialogTitle>
        </DialogHeader>
        {client && (
          <div className="space-y-6">
            <div className="grid grid-cols-1 gap-3 text-sm sm:grid-cols-2">
              <Info label="CPF/CNPJ" value={client.cpf_cnpj ?? "—"} />
              <Info label="Telefone" value={client.telefone} />
              <Info label="E-mail" value={client.email ?? "—"} />
              <Info label="Endereço" value={client.endereco ?? "—"} />
            </div>
            <section>
              <h3 className="mb-2 text-sm font-semibold">Resumo financeiro</h3>
              <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
                <Card>
                  <CardHeader className="pb-2"><CardTitle className="text-xs text-muted-foreground">Total contratado</CardTitle></CardHeader>
                  <CardContent><p className="text-xl font-bold font-mono">{formatBRL(totalContratado)}</p><p className="text-xs text-muted-foreground">{docs?.length ?? 0} processo(s)</p></CardContent>
                </Card>
                <Card>
                  <CardHeader className="pb-2"><CardTitle className="text-xs text-muted-foreground">Total recebido</CardTitle></CardHeader>
                  <CardContent><p className="text-xl font-bold font-mono text-accent">{formatBRL(totalRecebido)}</p><p className="text-xs text-muted-foreground">{pays?.length ?? 0} pagamento(s)</p></CardContent>
                </Card>
                <Card>
                  <CardHeader className="pb-2"><CardTitle className="text-xs text-muted-foreground">Saldo a receber</CardTitle></CardHeader>
                  <CardContent><p className={`text-xl font-bold font-mono ${saldoAReceber > 0 ? "text-amber-600" : "text-accent"}`}>{formatBRL(saldoAReceber)}</p><p className="text-xs text-muted-foreground">contratado − recebido</p></CardContent>
                </Card>
              </div>
            </section>'''
          if pays_marker not in s: raise SystemExit('profile header target not found')
          s = s.replace(pays_marker, summary, 1)
          calc_marker = '''  return (
    <Dialog open={enabled} onOpenChange={(o) => !o && onClose())>'''
          calc_insert = '''  const totalContratado = (docs ?? []).reduce((sum, d) => sum + Number(d.valor_total_processo ?? 0), 0);
  const totalRecebido = (pays ?? []).reduce((sum, p) => sum + Number(p.valor ?? 0), 0);
  const saldoAReceber = totalContratado - totalRecebido;

  return (
    <Dialog open={enabled} onOpenChange={(o) => !o && onClose())>'''
          if calc_marker not in s: raise SystemExit('profile return marker not found')
          s = s.replace(calc_marker, calc_insert, 1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/clientes.tsx
          git commit -m 'feat: resumo financeiro na ficha do cliente [skip ci]'
          git push
          rm .github/workflows/phase4-client-finance.yml
          git add -u .github/workflows/phase4-client-finance.yml
          git commit -m 'chore: remover workflow temporário da fase 4 [skip ci]'
          git push
