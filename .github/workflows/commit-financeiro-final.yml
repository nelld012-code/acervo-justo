name: Commit financeiro final

on:
  push:
    branches:
      - fix/financeiro-relatorios-actions

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore main report and apply minimal actions
        run: python scripts/restore_and_patch_financeiro.py
      - name: Validate build
        run: |
          npm install
          npm run build
      - name: Commit and clean temporary files
        run: |
          rm -f scripts/restore_and_patch_financeiro.py scripts/patch_financeiro_relatorios.py .github/workflows/commit-financeiro-final.yml .github/workflows/minimal-financeiro-actions.yml .github/workflows/verify-financeiro-patch.yml .github/workflows/run-financeiro-patch.yml .github/workflows/one-shot-financeiro-actions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserva relatório e adiciona ações por registro"
          git push origin HEAD:fix/financeiro-relatorios-actions
